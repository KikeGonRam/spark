[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanblade-analytics"
version = "0.1.0"
description = "AnalÃ­tica operativa y modelos de negocio de UrbanBlade"
requires-python = ">=3.11,<3.13"
readme = "README.md"
authors = [{name = "Equipo UrbanBlade"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/KikeGonRam/spark"
Issues = "https://github.com/KikeGonRam/spark/issues"

[project.scripts]
urbanblade-analytics-check = "config.diagnostics:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-dashboard.txt"]}

[tool.setuptools.packages.find]
include = ["config*", "analytics*", "pipelines*", "data_ingestion*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["runtime: requiere Spark/Java y dependencias del dashboard"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["docs", "data", "modelo_pipeline_rf_urbanblade"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.package-data]
dashboard = ["assets/*"]
