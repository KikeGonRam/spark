name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas y guarda de solo lectura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ANALYTICS_E2E_URI: mongodb://127.0.0.1:27017
      ANALYTICS_E2E_DB: spark_ci_${{ github.run_id }}_e2e
      ALLOW_ANALYTICS_PUBLICATION: "false"
      ALLOW_SYNTHETIC_WRITES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-ci.txt
      - name: Sintaxis y errores estáticos
        run: |
          python -m compileall -q config analytics dashboard pipelines data_ingestion tests
          python -m ruff check config analytics dashboard pipelines data_ingestion tests
      - name: Contratos e integración con Mongo efímero local
        run: python -m pytest tests/ -v
      - name: Detectar secretos en la historia de la rama
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact=100 --ignore-gitleaks-allow --no-banner
      - name: Archivos privados fuera de Git
        run: python scripts/check_repository.py

  runtime:
    name: Runtime Spark y dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construir runtime sin variables ni datos reales
        run: docker build -t urbanblade-analytics-ci .
      - name: Spark y Streamlit con datos sintéticos
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/tests:/app/tests:ro"
          urbanblade-analytics-ci python -B -m unittest discover -s tests/runtime -v
      - name: Auditar dependencias realmente instaladas
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r requirements-ci.txt
          docker run --rm urbanblade-analytics-ci python -m pip freeze --all > "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip

# Este workflow nunca recibe secretos de Atlas, publica insights ni despliega imágenes.
