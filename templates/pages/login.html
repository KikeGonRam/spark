{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-primary-100">
    <div class="w-full max-w-md">
        <div class="card">
            <h1 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h1>
            
            <form id="loginForm" @submit.prevent="handleLogin" class="space-y-4">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input 
                        type="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <!-- Remember Me -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember"
                        class="rounded"
                    >
                    <label for="remember" class="ml-2 text-sm text-secondary-700">
                        Recuérdame
                    </label>
                </div>
                
                <!-- Submit -->
                <button type="submit" class="btn btn-primary btn-block">
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Links -->
            <div class="mt-6 pt-6 border-t border-secondary-200 space-y-2 text-center text-sm">
                <p>
                    <a href="/register" class="text-primary-600 hover:text-primary-700 font-semibold">
                        Crear nueva cuenta
                    </a>
                </p>
                <p>
                    <a href="/forgot-password" class="text-primary-600 hover:text-primary-700">
                        ¿Olvidaste tu contraseña?
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(form);
        const data = {
            email: formData.get('email'),
            password: formData.get('password'),
        };
        
        try {
            const response = await window.api.post('/auth/login', data);
            
            if (response.success) {
                // Guardar tokens
                window.api.setToken(response.data.access_token);
                localStorage.setItem('refresh_token', response.data.refresh_token);
                
                // Guardar usuario
                window.auth.saveUser(response.data.user);
                
                // Redirigir
                Notification.success('¡Bienvenido!');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } else {
                Notification.error(response.message || 'Error al iniciar sesión');
            }
        } catch (error) {
            Notification.error('Error: ' + error.message);
        }
    });
});
</script>
{% endblock %}
