services:
  # ⚛️ React/Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barberpro-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - internal

  # 🐍 Python FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberpro-app
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_HOST=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "9000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # 🌐 Nginx Web Server
  web:
    image: nginx:alpine
    container_name: barberpro-web
    restart: unless-stopped
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - .:/app
      - ./public:/app/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # ⚡ Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: barberpro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # 📧 Mailpit Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: barberpro-mailpit
    restart: unless-stopped
    ports:
      - "9025:8025" # Web UI (changed from 8025)
      - "1125:1025" # SMTP (changed from 1025 to avoid port conflicts)
    networks:
      - internal

  # 🗄️ MongoDB Database
  mongodb:
    image: mongo:6
    container_name: barberpro-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: barberpro
    volumes:
      - mongo_data:/data/db
      - ./.docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "admin",
          "--password",
          "password",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
