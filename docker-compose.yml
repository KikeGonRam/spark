# Solo desarrollo local. No inicia ni modifica Barber, Atlas o servicios AWS.
services:
  dashboard:
    build: .
    image: urbanblade-spark-dashboard:local
    restart: unless-stopped
    env_file: ${SPARK_ENV_FILE:-.env}
    environment:
      BARBER_API_URL: ${BARBER_API_URL:-http://web}
      BARBER_PUBLIC_URL: ${BARBER_PUBLIC_URL:-http://localhost:8000}
      ALLOW_ANALYTICS_PUBLICATION: "false"
      ALLOW_SYNTHETIC_WRITES: "false"
    ports:
      - "127.0.0.1:8501:8501"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [barber_internal]

networks:
  barber_internal:
    external: true
    name: ${BARBER_DOCKER_NETWORK:-barber_internal}
