[pytest]
# Configuración de pytest para BarberPro Elite

# Paths
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Environment
env_file = .env.test

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage
# Use: pytest --cov=app --cov-report=html
testmon_off = False

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (deselect with '-m "not slow"')
    e2e: End-to-end tests
    security: Security tests
    performance: Performance tests

# Timeout (segundos)
timeout = 300

# AsyncIO mode for async tests
asyncio_mode = auto

# Database
mongodb_url = mongodb://localhost:27017
mongodb_database = barberpro_test

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Variables de entorno para tests
# PYTEST_ENVIRONMENT = testing
# PYTEST_LOG_LEVEL = DEBUG
